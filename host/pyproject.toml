[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nireyecam"
version = "0.2.0"
description = "Record and time-align HM01B0 NIR eye cameras over USB"
requires-python = ">=3.9"
license = "LicenseRef-Princeton"
license-files = ["LICENSE"]  # symlink to the repo's top-level LICENSE
dependencies = ["numpy>=1.22", "pyserial>=3.5"]

[project.optional-dependencies]
preview = ["opencv-python>=4.6"]
test = ["pytest>=7"]

[project.scripts]
nireyecam-record = "nireyecam.record:main"
nireyecam-align = "nireyecam.align:main"
nireyecam-list = "nireyecam.record:list_main"
nireyecam-bench = "nireyecam.bench:main"
nireyecam-sensortest = "nireyecam.sensortest:main"

[tool.setuptools]
packages = ["nireyecam"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
# Bugs only: syntax errors, undefined names, unused imports and variables
# (Pyflakes). Newer ruff defaults add style rules that flag deliberate code.
select = ["E4", "E7", "E9", "F"]
