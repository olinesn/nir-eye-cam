<svg xmlns="http://www.w3.org/2000/svg" width="680" height="568" viewBox="0 0 680 568" role="img" aria-labelledby="title desc">
<title id="title">One camera: the parts at the eye, and the bench electronics that serve them</title>
<desc id="desc">A dashed region labelled At the eye holds the eye, the camera on its ST P-Board looking at it, and two TSAL6400 IR LEDs aimed at it. Below the camera, the TXB0104 level shifter takes the sensor's STROBE, FSYNC and TRIG; FSYNC and TRIG go up to the ESP32-P4X board's header; STROBE and the board's LED enable meet at the 74HCT08 AND gate, which drives the IRLB3813 MOSFET through 220 ohms. The MOSFET sinks current through the two LEDs and a 120 ohm resistor from 5 V. The camera's video goes over the Pi 5 cable to the ESP32 board and on over USB-C to the computer. Pins are in the schematic and firmware-p4/main/board.h, not in this picture.</desc>
