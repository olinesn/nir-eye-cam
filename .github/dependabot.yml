# Dependabot opens a pull request when a GitHub Action this repo pins has a
# newer release: monthly, grouped into one pull request, and only for releases
# at least two weeks old (cooldown), the same caution the actions were first
# pinned with.
#
# Python dependencies are deliberately not tracked. The host package supports
# Python 3.9+, and current numpy and pytest need 3.10+, so Dependabot cannot
# move host/uv.lock forward (it tried, and every run failed). CI does not use
# the lock: it installs the newest versions each Python accepts, so new
# releases get tested whenever host/ changes.
#
# Not covered: Dependabot cannot read these, so update them by hand:
# - in .github/workflows/firmware.yml, the ESP-IDF container image (pinned by
#   digest), the Arm toolchain version and checksum, and the Pico SDK version;
# - firmware-p4/main/idf_component.yml and dependencies.lock (ESP-IDF's
#   component manager).

version: 2
updates:
  # Actions are pinned to commit SHAs with a "# vX.Y.Z" comment; Dependabot
  # updates both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      github-actions:
        patterns: ["*"]
