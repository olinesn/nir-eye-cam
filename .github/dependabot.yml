# Dependabot opens a pull request when something this repo pins has a newer
# release: monthly, one grouped pull request per ecosystem, and only for
# releases at least two weeks old (cooldown), the same caution the actions
# were first pinned with.
#
# Not covered: Dependabot cannot read these, so update them by hand:
# - in .github/workflows/firmware.yml, the ESP-IDF container image (pinned by
#   digest), the Arm toolchain version and checksum, and the Pico SDK version;
# - firmware-p4/main/idf_component.yml and dependencies.lock (ESP-IDF's
#   component manager).

version: 2
updates:
  # Actions are pinned to commit SHAs with a "# vX.Y.Z" comment; Dependabot
  # updates both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      github-actions:
        patterns: ["*"]

  # The host package's lock file (host/uv.lock).
  - package-ecosystem: uv
    directory: /host
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      python:
        patterns: ["*"]
